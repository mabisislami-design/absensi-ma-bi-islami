<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Digital MA BI ISLAMI</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.10);
    }

    h1 { margin-bottom: 5px; }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 20px;
      margin: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    .pilih {
      background: #1f4e78;
      color: white;
      width: 90%;
    }

    .masuk {
      background: #188038;
      color: white;
      width: 90%;
      font-weight: bold;
    }

    .pulang {
      background: #1f4e78;
      color: white;
      width: 90%;
      font-weight: bold;
    }

    .izin {
      background: #f9ab00;
      color: white;
      width: 90%;
      font-weight: bold;
    }

    .sakit {
      background: #d93025;
      color: white;
      width: 90%;
      font-weight: bold;
    }

    .kembali {
      background: #777;
      color: white;
    }

    #reader {
      width: 100%;
      margin: 15px auto;
    }

    .identitas {
      background: #f1f5f9;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      text-align: left;
    }

    .pesan {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>ABSENSI DIGITAL</h1>
  <h2>MA BI ISLAMI</h2>

  <div id="awal">

    <p><b>Pilih menu absensi</b></p>

    <button class="pilih" onclick="mulai('SISWA')">
      👨‍🎓 ABSENSI SISWA
    </button>

    <button class="pilih" onclick="mulai('GURU')">
      👩‍🏫 ABSENSI GURU
    </button>

    <hr>

    <p><b>Pencatatan Izin / Sakit</b></p>

    <button class="izin" onclick="mulaiIzinSakit()">
      📝 IZIN / SAKIT SISWA
    </button>

  </div>

  <div id="scanner" style="display:none;">

    <h3 id="judulScanner"></h3>

    <div id="reader"></div>

    <p>Arahkan kamera ke QR Code.</p>

    <button class="kembali" onclick="kembali()">
      Kembali
    </button>

  </div>

  <div id="konfirmasi" style="display:none;">

    <h3>Data Ditemukan ✅</h3>

    <div class="identitas" id="identitas"></div>

    <br>

    <p><b>Pilih jenis kehadiran:</b></p>

    <button class="masuk" onclick="simpanAbsensi('MASUK')">
      🟢 MASUK
    </button>

    <button class="pulang" onclick="simpanAbsensi('PULANG')">
      🔵 PULANG
    </button>

    <br>

    <button class="kembali" onclick="kembali()">
      Batal
    </button>

    <p class="pesan" id="pesan"></p>

  </div>

  <div id="izinSakit" style="display:none;">

    <h3>Data Siswa Ditemukan ✅</h3>

    <div class="identitas" id="identitasIzin"></div>

    <br>

    <p><b>Pilih keterangan:</b></p>

    <button class="izin" onclick="simpanIzinSakit('IZIN')">
      🟡 IZIN
    </button>

    <button class="sakit" onclick="simpanIzinSakit('SAKIT')">
      🔴 SAKIT
    </button>

    <br>

    <button class="kembali" onclick="kembali()">
      Batal
    </button>

    <p class="pesan" id="pesanIzin"></p>

  </div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbyL1dxkM_FU3d4-2Kkumw3yXmYdgwnAPD1EeBqfeFXQG8w3ffk3gD-tCZfLTqXVsJD_3Q/exec";

let jenis = "";
let scanner = null;
let dataTerpilih = null;
let modeIzinSakit = false;
let sedangScan = false;


/* ================================
   MULAI
================================ */

function mulai(pilihan) {

  jenis = pilihan;
  modeIzinSakit = false;
  dataTerpilih = null;

  document.getElementById("awal").style.display = "none";
  document.getElementById("konfirmasi").style.display = "none";
  document.getElementById("izinSakit").style.display = "none";
  document.getElementById("scanner").style.display = "block";

  document.getElementById("judulScanner").innerText =
    pilihan === "SISWA"
      ? "Scan QR Siswa"
      : "Scan QR Guru";

  bukaKamera();
}


/* ================================
   IZIN / SAKIT
================================ */

function mulaiIzinSakit() {

  jenis = "SISWA";
  modeIzinSakit = true;
  dataTerpilih = null;

  document.getElementById("awal").style.display = "none";
  document.getElementById("konfirmasi").style.display = "none";
  document.getElementById("izinSakit").style.display = "none";
  document.getElementById("scanner").style.display = "block";

  document.getElementById("judulScanner").innerText =
    "Scan QR Siswa - Izin / Sakit";

  bukaKamera();
}


/* ================================
   KAMERA
================================ */

function bukaKamera() {

  sedangScan = true;

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(qrId) {

      if (!sedangScan) return;

      sedangScan = false;

      qrId = String(qrId || "").trim();

      if (!qrId) {
        alert("QR ID kosong.");
        kembali();
        return;
      }

      scanner.stop().then(function() {

        document.getElementById("scanner").style.display =
          "none";

        cariData(qrId);

      }).catch(function() {

        document.getElementById("scanner").style.display =
          "none";

        cariData(qrId);

      });

    }

  ).catch(function(error) {

    sedangScan = false;

    alert(
      "Kamera tidak dapat dibuka. Pastikan browser mengizinkan kamera."
    );

  });
}


/* ================================
   CARI DATA
================================ */

function cariData(qrId) {

  qrId = String(qrId || "").trim();

  if (!qrId) {

    alert("QR ID kosong.");

    kembali();

    return;
  }

  const callbackName =
    "callback_cari_" + Date.now();

  window[callbackName] = function(data) {

    delete window[callbackName];

    if (!data) {

      alert("Tidak ada respons dari server.");

      kembali();

      return;
    }

    if (!data.berhasil) {

      alert(
        data.pesan ||
        "QR Code tidak ditemukan."
      );

      kembali();

      return;
    }

    dataTerpilih = data;


    /* ================================
       IZIN / SAKIT
    ================================= */

    if (modeIzinSakit) {

      let html = "";

      html +=
        "<b>Nama:</b> " +
        (data.nama || "-") +
        "<br><br>";

      html +=
        "<b>NIS:</b> " +
        (data.nis || "-") +
        "<br>";

      html +=
        "<b>Kelas:</b> " +
        (data.kelas || "-");

      document.getElementById("identitasIzin").innerHTML =
        html;

      document.getElementById("izinSakit").style.display =
        "block";

      return;
    }


    /* ================================
       ABSENSI BIASA
    ================================= */

    let html = "";

    html +=
      "<b>Nama:</b> " +
      (data.nama || "-") +
      "<br><br>";

    if (jenis === "SISWA") {

      html +=
        "<b>NIS:</b> " +
        (data.nis || "-") +
        "<br>";

      html +=
        "<b>Kelas:</b> " +
        (data.kelas || "-") +
        "<br>";

    } else {

      html +=
        "<b>NIP:</b> " +
        (data.nip || "-") +
        "<br>";

      html +=
        "<b>Jabatan:</b> " +
        (data.jabatan || "-") +
        "<br>";
    }

    document.getElementById("identitas").innerHTML =
      html;

    document.getElementById("konfirmasi").style.display =
      "block";

  };


  const script =
    document.createElement("script");

  script.src =
    API +
    "?action=cari" +
    "&jenis=" +
    encodeURIComponent(jenis) +
    "&qrId=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    callbackName;

  script.onerror = function() {

    delete window[callbackName];

    alert(
      "Gagal terhubung ke server absensi."
    );

    kembali();

  };

  document.body.appendChild(script);
}


/* ================================
   SIMPAN MASUK / PULANG
================================ */

function simpanAbsensi(keterangan) {

  if (
    keterangan !== "MASUK" &&
    keterangan !== "PULANG"
  ) {

    alert("Jenis kehadiran tidak valid.");

    return;
  }

  if (!dataTerpilih) {

    alert("Data peserta belum ditemukan.");

    return;
  }

  document.getElementById("pesan").innerText =
    "Menyimpan ABSENSI " +
    keterangan +
    "...";

  kirimAbsensi(
    keterangan,
    "pesan"
  );
}


/* ================================
   SIMPAN IZIN / SAKIT
================================ */

function simpanIzinSakit(keterangan) {

  if (
    keterangan !== "IZIN" &&
    keterangan !== "SAKIT"
  ) {

    alert("Jenis keterangan tidak valid.");

    return;
  }

  if (!dataTerpilih) {

    alert("Data siswa belum ditemukan.");

    return;
  }

  document.getElementById("pesanIzin").innerText =
    "Menyimpan " +
    keterangan +
    "...";

  kirimAbsensi(
    keterangan,
    "pesanIzin"
  );
}


/* ================================
   KIRIM KE SERVER
================================ */

function kirimAbsensi(
  keterangan,
  idPesan
) {

  if (!dataTerpilih) {

    document.getElementById(idPesan).innerText =
      "Data belum ditemukan.";

    return;
  }


  /*
   * PENTING:
   * Gunakan QR_ID dari data hasil scan.
   * BUKAN ID database.
   */

  const qrId =
    String(
      dataTerpilih.qrId || ""
    ).trim();


  if (!qrId) {

    document.getElementById(idPesan).innerText =
      "QR ID tidak ditemukan.";

    return;
  }


  const callbackName =
    "callback_simpan_" + Date.now();


  window[callbackName] = function(data) {

    delete window[callbackName];


    if (!data) {

      document.getElementById(idPesan).innerText =
        "Tidak ada respons dari server.";

      return;
    }


    document.getElementById(idPesan).innerText =
      data.pesan || "Selesai.";


    if (data.berhasil) {

      setTimeout(function() {

        kembali();

      }, 2000);

    }

  };


  const script =
    document.createElement("script");


  /*
   * INI PERBAIKAN UTAMA:
   *
   * sebelumnya:
   * &id=dataTerpilih.id
   *
   * sekarang:
   * &qrId=dataTerpilih.qrId
   */

  script.src =
    API +
    "?action=simpan" +
    "&jenis=" +
    encodeURIComponent(jenis) +
    "&qrId=" +
    encodeURIComponent(qrId) +
    "&keterangan=" +
    encodeURIComponent(keterangan) +
    "&callback=" +
    callbackName;


  script.onerror = function() {

    delete window[callbackName];

    document.getElementById(idPesan).innerText =
      "Gagal terhubung ke server.";

  };


  document.body.appendChild(script);
}


/* ================================
   KEMBALI
================================ */

function kembali() {

  sedangScan = false;

  if (scanner) {

    scanner.stop().catch(function(){});

    try {
      scanner.clear();
    } catch (e) {}

    scanner = null;
  }


  jenis = "";
  dataTerpilih = null;
  modeIzinSakit = false;


  document.getElementById("awal").style.display =
    "block";

  document.getElementById("scanner").style.display =
    "none";

  document.getElementById("konfirmasi").style.display =
    "none";

  document.getElementById("izinSakit").style.display =
    "none";


  document.getElementById("identitas").innerHTML =
    "";

  document.getElementById("identitasIzin").innerHTML =
    "";

  document.getElementById("pesan").innerText =
    "";

  document.getElementById("pesanIzin").innerText =
    "";
}

</script>

</body>
</html>
